<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BuildFast — Startup Idea Analyzer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #18181f;
      --border: #2a2a35;
      --accent: #7c6af7;
      --accent-glow: rgba(124, 106, 247, 0.2);
      --text: #e8e8f0;
      --muted: #888;
      --green: #4ade80;
      --red: #f87171;
      --yellow: #fbbf24;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--accent);
    }

    .logo span { color: var(--text); }

    main {
      width: 100%;
      max-width: 860px;
      padding: 3rem 1.5rem 4rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .hero {
      text-align: center;
    }

    .hero h1 {
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.15;
      margin-bottom: 0.75rem;
    }

    .hero p {
      color: var(--muted);
      font-size: 1.05rem;
    }

    .input-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.6;
      min-height: 120px;
      padding: 0.875rem 1rem;
      resize: vertical;
      transition: border-color 0.15s;
      width: 100%;
    }

    textarea:focus {
      border-color: var(--accent);
      outline: none;
    }

    textarea::placeholder { color: var(--muted); }

    .btn {
      align-items: center;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      display: flex;
      font-size: 0.95rem;
      font-weight: 600;
      gap: 0.5rem;
      justify-content: center;
      padding: 0.75rem 1.5rem;
      transition: opacity 0.15s, transform 0.1s;
      width: fit-content;
    }

    .btn:hover:not(:disabled) { opacity: 0.9; }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .examples {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }

    .examples-label {
      color: var(--muted);
      font-size: 0.8rem;
    }

    .example-chip {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.78rem;
      padding: 0.3rem 0.75rem;
      transition: border-color 0.15s, color 0.15s;
    }

    .example-chip:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    /* Loading */
    .loading {
      align-items: center;
      display: none;
      flex-direction: column;
      gap: 1rem;
      padding: 3rem;
      text-align: center;
    }

    .loading.visible { display: flex; }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text { color: var(--muted); font-size: 0.9rem; }

    /* Results */
    .results { display: none; flex-direction: column; gap: 1.5rem; }
    .results.visible { display: flex; }

    /* Score banner */
    .score-banner {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 2rem;
      padding: 1.5rem;
      flex-wrap: wrap;
    }

    .score-circle {
      position: relative;
      width: 90px;
      height: 90px;
      flex-shrink: 0;
    }

    .score-circle svg { transform: rotate(-90deg); }

    .score-circle .track {
      fill: none;
      stroke: var(--border);
      stroke-width: 8;
    }

    .score-circle .fill {
      fill: none;
      stroke-width: 8;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s ease;
    }

    .score-number {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 800;
    }

    .score-number small {
      font-size: 0.65rem;
      color: var(--muted);
      font-weight: 500;
    }

    .score-info { flex: 1; min-width: 200px; }

    .score-verdict {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      line-height: 1.4;
    }

    .score-bars { display: flex; flex-direction: column; gap: 0.4rem; }

    .score-bar-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.78rem;
    }

    .score-bar-label { color: var(--muted); width: 130px; flex-shrink: 0; }

    .score-bar-track {
      flex: 1;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .score-bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 1s ease;
    }

    .score-bar-val { color: var(--muted); width: 30px; text-align: right; }

    /* Tabs */
    .tabs-wrapper {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .tab-list {
      display: flex;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tab-list::-webkit-scrollbar { display: none; }

    .tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 0.875rem 1.25rem;
      transition: color 0.15s, border-color 0.15s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .tab-btn:hover { color: var(--text); }

    .tab-btn.active {
      border-bottom-color: var(--accent);
      color: var(--text);
    }

    .tab-icon { font-size: 1rem; }

    .tab-panel { display: none; padding: 1.75rem; }
    .tab-panel.active { display: block; }

    /* Summary tab */
    .summary-text {
      color: var(--text);
      line-height: 1.75;
      font-size: 0.95rem;
    }

    .summary-text p + p { margin-top: 1rem; }

    /* Market tab */
    .market-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    @media (max-width: 540px) { .market-grid { grid-template-columns: 1fr; } }

    .market-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
    }

    .market-card-label {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    .market-card-value { font-size: 0.9rem; line-height: 1.5; }

    .competitors-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .competitor-tag {
      background: var(--accent-glow);
      border: 1px solid rgba(124, 106, 247, 0.3);
      border-radius: 4px;
      color: var(--accent);
      font-size: 0.82rem;
      padding: 0.2rem 0.6rem;
    }

    /* Red Flags tab */
    .flag-list { display: flex; flex-direction: column; gap: 0.75rem; }

    .flag-item {
      background: var(--bg);
      border: 1px solid rgba(248, 113, 113, 0.2);
      border-left: 3px solid var(--red);
      border-radius: 0 8px 8px 0;
      padding: 1rem;
    }

    .flag-title {
      color: var(--red);
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .flag-detail { color: var(--muted); font-size: 0.85rem; line-height: 1.55; }

    /* Next Steps tab */
    .steps-list { display: flex; flex-direction: column; gap: 0.75rem; counter-reset: steps; }

    .step-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1rem 1rem 1.25rem;
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      counter-increment: steps;
    }

    .step-num {
      background: var(--accent-glow);
      border: 1px solid rgba(124, 106, 247, 0.3);
      border-radius: 50%;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .step-content { flex: 1; }

    .step-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }

    .step-detail { color: var(--muted); font-size: 0.85rem; line-height: 1.55; }

    /* Error */
    .error-banner {
      background: rgba(248, 113, 113, 0.08);
      border: 1px solid rgba(248, 113, 113, 0.3);
      border-radius: 8px;
      color: var(--red);
      display: none;
      font-size: 0.9rem;
      padding: 1rem 1.25rem;
    }

    .error-banner.visible { display: block; }
  </style>
</head>
<body>
  <header>
    <div class="logo">Build<span>Fast</span></div>
    <span style="color: var(--muted); font-size: 0.85rem;">Startup Idea Analyzer</span>
  </header>

  <main>
    <div class="hero">
      <h1>Is your idea worth building?</h1>
      <p>Describe your startup concept and get an instant AI-powered analysis.</p>
    </div>

    <div class="input-card">
      <textarea id="idea-input" placeholder="e.g. A marketplace where local farmers can sell directly to restaurants, cutting out distributors and reducing food waste by matching surplus supply with demand in real-time..." rows="5"></textarea>

      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
        <div class="examples">
          <span class="examples-label">Try:</span>
          <button class="example-chip" onclick="setExample('AI-powered legal contract review tool for small businesses that can\'t afford lawyers')">Legal AI</button>
          <button class="example-chip" onclick="setExample('A subscription box for rare, single-origin coffee beans sourced directly from micro-farms around the world')">Coffee sub</button>
          <button class="example-chip" onclick="setExample('On-demand mental health coaching app that connects users with certified coaches via 15-minute video sessions for $20')">Mental health</button>
        </div>
        <button class="btn" id="analyze-btn" onclick="analyze()">
          <span>Analyze idea</span>
          <span>→</span>
        </button>
      </div>
    </div>

    <div class="error-banner" id="error-banner"></div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div class="loading-text">Analyzing your idea with Claude Opus 4.6…</div>
    </div>

    <div class="results" id="results">
      <!-- Score banner -->
      <div class="score-banner">
        <div class="score-circle">
          <svg viewBox="0 0 90 90" width="90" height="90">
            <circle class="track" cx="45" cy="45" r="37" />
            <circle class="fill" id="score-arc" cx="45" cy="45" r="37"
              stroke-dasharray="232.5"
              stroke-dashoffset="232.5" />
          </svg>
          <div class="score-number">
            <span id="score-num">--</span>
            <small>/ 100</small>
          </div>
        </div>

        <div class="score-info">
          <div class="score-verdict" id="score-verdict"></div>
          <div class="score-bars" id="score-bars"></div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="tabs-wrapper">
        <div class="tab-list" role="tablist">
          <button class="tab-btn active" onclick="switchTab('summary')" id="tab-summary">
            <span class="tab-icon">📋</span> Summary
          </button>
          <button class="tab-btn" onclick="switchTab('market')" id="tab-market">
            <span class="tab-icon">📈</span> Market
          </button>
          <button class="tab-btn" onclick="switchTab('flags')" id="tab-flags">
            <span class="tab-icon">⚠️</span> Red Flags
          </button>
          <button class="tab-btn" onclick="switchTab('steps')" id="tab-steps">
            <span class="tab-icon">🚀</span> Next Steps
          </button>
        </div>

        <!-- Summary -->
        <div class="tab-panel active" id="panel-summary">
          <div class="summary-text" id="summary-text"></div>
        </div>

        <!-- Market -->
        <div class="tab-panel" id="panel-market">
          <div class="market-grid">
            <div class="market-card">
              <div class="market-card-label">Market Size</div>
              <div class="market-card-value" id="market-size"></div>
            </div>
            <div class="market-card">
              <div class="market-card-label">Timing</div>
              <div class="market-card-value" id="market-timing"></div>
            </div>
          </div>
          <div class="market-card" style="margin-bottom: 1rem;">
            <div class="market-card-label">Positioning</div>
            <div class="market-card-value" id="market-positioning"></div>
          </div>
          <div class="market-card">
            <div class="market-card-label">Key Competitors</div>
            <div class="competitors-list" id="competitors-list"></div>
          </div>
        </div>

        <!-- Red Flags -->
        <div class="tab-panel" id="panel-flags">
          <div class="flag-list" id="flag-list"></div>
        </div>

        <!-- Next Steps -->
        <div class="tab-panel" id="panel-steps">
          <div class="steps-list" id="steps-list"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const SCORE_COLORS = {
      high: '#4ade80',
      mid: '#fbbf24',
      low: '#f87171',
    };

    function scoreColor(n) {
      if (n >= 70) return SCORE_COLORS.high;
      if (n >= 45) return SCORE_COLORS.mid;
      return SCORE_COLORS.low;
    }

    function setExample(text) {
      document.getElementById('idea-input').value = text;
    }

    function switchTab(name) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.getElementById('tab-' + name).classList.add('active');
      document.getElementById('panel-' + name).classList.add('active');
    }

    function showError(msg) {
      const el = document.getElementById('error-banner');
      el.textContent = msg;
      el.classList.add('visible');
    }

    function hideError() {
      document.getElementById('error-banner').classList.remove('visible');
    }

    function renderResults(data) {
      // Score banner
      const score = data.score.overall;
      const color = scoreColor(score);
      const arc = document.getElementById('score-arc');
      const circumference = 232.5;
      arc.style.stroke = color;
      arc.style.strokeDashoffset = circumference - (score / 100) * circumference;

      const numEl = document.getElementById('score-num');
      numEl.textContent = score;
      numEl.style.color = color;

      document.getElementById('score-verdict').textContent = data.score.verdict;

      // Score bars
      const barsEl = document.getElementById('score-bars');
      const breakdown = data.score.breakdown;
      const labels = {
        market_opportunity: 'Market Opportunity',
        feasibility: 'Feasibility',
        differentiation: 'Differentiation',
        timing: 'Timing',
        team_fit: 'Team Fit',
      };
      barsEl.innerHTML = Object.entries(breakdown).map(([key, val]) => `
        <div class="score-bar-row">
          <span class="score-bar-label">${labels[key] || key}</span>
          <div class="score-bar-track">
            <div class="score-bar-fill" style="width: ${val}%; background: ${scoreColor(val)};"></div>
          </div>
          <span class="score-bar-val">${val}</span>
        </div>
      `).join('');

      // Summary
      const summaryEl = document.getElementById('summary-text');
      summaryEl.innerHTML = data.summary
        .split('\n\n')
        .filter(p => p.trim())
        .map(p => `<p>${p.trim()}</p>`)
        .join('');

      // Market
      document.getElementById('market-size').textContent = data.market.size;
      document.getElementById('market-timing').textContent = data.market.timing;
      document.getElementById('market-positioning').textContent = data.market.positioning;
      document.getElementById('competitors-list').innerHTML =
        data.market.competitors.map(c => `<span class="competitor-tag">${c}</span>`).join('');

      // Red flags
      document.getElementById('flag-list').innerHTML =
        data.red_flags.map(f => `
          <div class="flag-item">
            <div class="flag-title">⚑ ${f.flag}</div>
            <div class="flag-detail">${f.detail}</div>
          </div>
        `).join('');

      // Next steps
      document.getElementById('steps-list').innerHTML =
        data.next_steps.map((s, i) => `
          <div class="step-item">
            <div class="step-num">${i + 1}</div>
            <div class="step-content">
              <div class="step-title">${s.step}</div>
              <div class="step-detail">${s.detail}</div>
            </div>
          </div>
        `).join('');
    }

    async function analyze() {
      const idea = document.getElementById('idea-input').value.trim();
      if (!idea) return;

      const btn = document.getElementById('analyze-btn');
      btn.disabled = true;

      hideError();
      document.getElementById('loading').classList.add('visible');
      document.getElementById('results').classList.remove('visible');

      try {
        const response = await fetch('/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idea }),
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value);
          const lines = chunk.split('\n').filter(l => l.startsWith('data: '));

          for (const line of lines) {
            const payload = JSON.parse(line.slice(6));

            if (payload.status === 'done') {
              document.getElementById('loading').classList.remove('visible');
              renderResults(payload.result);
              document.getElementById('results').classList.add('visible');
              switchTab('summary');
            } else if (payload.status === 'error') {
              document.getElementById('loading').classList.remove('visible');
              showError(payload.message);
            }
          }
        }
      } catch (err) {
        document.getElementById('loading').classList.remove('visible');
        showError('Something went wrong. Please try again.');
      } finally {
        btn.disabled = false;
      }
    }

    // Allow Cmd/Ctrl+Enter to submit
    document.getElementById('idea-input').addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') analyze();
    });
  </script>
</body>
</html>
