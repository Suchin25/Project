<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TermSight — Term Sheet Analyzer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #18181f;
      --border: #2a2a35;
      --accent: #7c6af7;
      --accent-glow: rgba(124, 106, 247, 0.2);
      --text: #e8e8f0;
      --muted: #888;
      --green: #4ade80;
      --red: #f87171;
      --yellow: #fbbf24;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; color: var(--accent); }
    .logo span { color: var(--text); }

    main {
      width: 100%;
      max-width: 860px;
      padding: 3rem 1.5rem 4rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .hero { text-align: center; }

    .hero h1 {
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.15;
      margin-bottom: 0.75rem;
    }

    .hero p { color: var(--muted); font-size: 1.05rem; }

    .input-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      line-height: 1.65;
      min-height: 180px;
      padding: 0.875rem 1rem;
      resize: vertical;
      transition: border-color 0.15s;
      width: 100%;
    }

    textarea:focus { border-color: var(--accent); outline: none; }
    textarea::placeholder { color: var(--muted); }

    .char-count { color: var(--muted); font-size: 0.75rem; text-align: right; }
    .char-count.warn { color: var(--yellow); }

    .btn {
      align-items: center;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      display: flex;
      font-size: 0.95rem;
      font-weight: 600;
      gap: 0.5rem;
      justify-content: center;
      padding: 0.75rem 1.5rem;
      transition: opacity 0.15s, transform 0.1s;
      width: fit-content;
    }

    .btn:hover:not(:disabled) { opacity: 0.9; }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .examples {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }

    .examples-label { color: var(--muted); font-size: 0.8rem; }

    .example-chip {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.78rem;
      padding: 0.3rem 0.75rem;
      transition: border-color 0.15s, color 0.15s;
    }

    .example-chip:hover { border-color: var(--accent); color: var(--text); }

    /* Loading */
    .loading {
      align-items: center;
      display: none;
      flex-direction: column;
      gap: 1rem;
      padding: 3rem;
      text-align: center;
    }

    .loading.visible { display: flex; }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--muted); font-size: 0.9rem; }

    /* Results */
    .results { display: none; flex-direction: column; gap: 1.5rem; }
    .results.visible { display: flex; }

    /* Score banner */
    .score-banner {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 2rem;
      padding: 1.5rem;
      flex-wrap: wrap;
    }

    .score-circle { position: relative; width: 90px; height: 90px; flex-shrink: 0; }
    .score-circle svg { transform: rotate(-90deg); }
    .score-circle .track { fill: none; stroke: var(--border); stroke-width: 8; }
    .score-circle .fill { fill: none; stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 1s ease; }

    .score-number {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 800;
    }

    .score-number small { font-size: 0.65rem; color: var(--muted); font-weight: 500; }

    .score-info { flex: 1; min-width: 200px; }

    .score-label {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.35rem;
    }

    .score-verdict { font-size: 1rem; font-weight: 600; margin-bottom: 0.75rem; line-height: 1.4; }

    .score-bars { display: flex; flex-direction: column; gap: 0.4rem; }

    .score-bar-row { display: flex; align-items: center; gap: 0.75rem; font-size: 0.78rem; }
    .score-bar-label { color: var(--muted); width: 150px; flex-shrink: 0; }
    .score-bar-track { flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .score-bar-fill { height: 100%; border-radius: 2px; transition: width 1s ease; }
    .score-bar-val { color: var(--muted); width: 30px; text-align: right; }

    /* Tabs */
    .tabs-wrapper {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .tab-list {
      display: flex;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tab-list::-webkit-scrollbar { display: none; }

    .tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 0.875rem 1.25rem;
      transition: color 0.15s, border-color 0.15s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { border-bottom-color: var(--accent); color: var(--text); }
    .tab-icon { font-size: 1rem; }

    .tab-panel { display: none; padding: 1.75rem; }
    .tab-panel.active { display: block; }

    /* Summary */
    .summary-text { color: var(--text); line-height: 1.75; font-size: 0.95rem; }
    .summary-text p + p { margin-top: 1rem; }

    /* Key Terms */
    .terms-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    @media (max-width: 540px) { .terms-grid { grid-template-columns: 1fr; } }

    .term-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
    }

    .term-label {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    .term-value { font-size: 0.9rem; line-height: 1.5; }

    /* Red Flags */
    .flag-list { display: flex; flex-direction: column; gap: 0.75rem; }

    .flag-item {
      background: var(--bg);
      border: 1px solid;
      border-left-width: 3px;
      border-radius: 0 8px 8px 0;
      padding: 1rem;
    }

    .flag-high { border-color: rgba(248, 113, 113, 0.2); border-left-color: var(--red); }
    .flag-medium { border-color: rgba(251, 191, 36, 0.2); border-left-color: var(--yellow); }
    .flag-low { border-color: rgba(136, 136, 136, 0.15); border-left-color: var(--muted); }

    .flag-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .severity-badge {
      border-radius: 3px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 0.1rem 0.45rem;
      text-transform: uppercase;
    }

    .severity-high { background: rgba(248, 113, 113, 0.15); color: var(--red); }
    .severity-medium { background: rgba(251, 191, 36, 0.15); color: var(--yellow); }
    .severity-low { background: rgba(136, 136, 136, 0.15); color: var(--muted); }

    .flag-detail { color: var(--muted); font-size: 0.85rem; line-height: 1.55; }

    /* Recommendations */
    .recs-list { display: flex; flex-direction: column; gap: 0.75rem; }

    .rec-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1rem 1rem 1.25rem;
      display: flex;
      gap: 1rem;
      align-items: flex-start;
    }

    .rec-num {
      background: var(--accent-glow);
      border: 1px solid rgba(124, 106, 247, 0.3);
      border-radius: 50%;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .rec-content { flex: 1; }
    .rec-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 0.3rem; }
    .rec-detail { color: var(--muted); font-size: 0.85rem; line-height: 1.55; }

    /* Error */
    .error-banner {
      background: rgba(248, 113, 113, 0.08);
      border: 1px solid rgba(248, 113, 113, 0.3);
      border-radius: 8px;
      color: var(--red);
      display: none;
      font-size: 0.9rem;
      padding: 1rem 1.25rem;
    }

    .error-banner.visible { display: block; }
  </style>
</head>
<body>
  <header>
    <div class="logo">Term<span>Sight</span></div>
    <span style="color: var(--muted); font-size: 0.85rem;">Term Sheet Analyzer</span>
  </header>

  <main>
    <div class="hero">
      <h1>Know what you're signing.</h1>
      <p>Paste your term sheet and get an instant, plain-English analysis from an AI trained on VC deals.</p>
    </div>

    <div class="input-card">
      <textarea id="ts-input"
        placeholder="Paste your term sheet here — equity round, SAFE, convertible note, or any investment document..."
        rows="8"
        oninput="updateCharCount()"></textarea>

      <div class="char-count" id="char-count">0 / 20,000</div>

      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
        <div class="examples">
          <span class="examples-label">Try an example:</span>
          <button class="example-chip" onclick="setExample('series-a')">Series A equity</button>
          <button class="example-chip" onclick="setExample('safe')">Y Combinator SAFE</button>
          <button class="example-chip" onclick="setExample('note')">Convertible note</button>
        </div>
        <button class="btn" id="analyze-btn" onclick="analyze()">
          <span>Analyze</span>
          <span>→</span>
        </button>
      </div>
    </div>

    <div class="error-banner" id="error-banner"></div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div class="loading-text">Reviewing your term sheet with Claude Opus 4.6…</div>
    </div>

    <div class="results" id="results">
      <!-- Score banner -->
      <div class="score-banner">
        <div class="score-circle">
          <svg viewBox="0 0 90 90" width="90" height="90">
            <circle class="track" cx="45" cy="45" r="37" />
            <circle class="fill" id="score-arc" cx="45" cy="45" r="37"
              stroke-dasharray="232.5"
              stroke-dashoffset="232.5" />
          </svg>
          <div class="score-number">
            <span id="score-num">--</span>
            <small>/ 100</small>
          </div>
        </div>

        <div class="score-info">
          <div class="score-label">Founder-Friendliness Score</div>
          <div class="score-verdict" id="score-verdict"></div>
          <div class="score-bars" id="score-bars"></div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="tabs-wrapper">
        <div class="tab-list" role="tablist">
          <button class="tab-btn active" onclick="switchTab('summary')" id="tab-summary">
            <span class="tab-icon">📋</span> Summary
          </button>
          <button class="tab-btn" onclick="switchTab('terms')" id="tab-terms">
            <span class="tab-icon">📄</span> Key Terms
          </button>
          <button class="tab-btn" onclick="switchTab('flags')" id="tab-flags">
            <span class="tab-icon">⚠️</span> Red Flags
          </button>
          <button class="tab-btn" onclick="switchTab('recs')" id="tab-recs">
            <span class="tab-icon">💬</span> Negotiate
          </button>
        </div>

        <div class="tab-panel active" id="panel-summary">
          <div class="summary-text" id="summary-text"></div>
        </div>

        <div class="tab-panel" id="panel-terms">
          <div class="terms-grid" id="terms-grid"></div>
        </div>

        <div class="tab-panel" id="panel-flags">
          <div class="flag-list" id="flag-list"></div>
        </div>

        <div class="tab-panel" id="panel-recs">
          <div class="recs-list" id="recs-list"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const EXAMPLES = {
      'series-a': `Series A Preferred Stock Term Sheet

Issuer: Acme Corp
Investors: Venture Partners LLC
Amount: $3,000,000
Pre-Money Valuation: $9,000,000
Post-Money Valuation: $12,000,000

Security: Series A Preferred Stock
Liquidation Preference: 2x participating preferred
Anti-Dilution: Full ratchet
Dividends: 8% cumulative
Board: 2 investor seats, 1 founder seat, 1 independent (investor approval required)
Protective Provisions: Investor veto on any financing, acquisition, or budget over $100K
Pro-Rata Rights: Yes, for all investors
Vesting: 4-year vesting, 2-year cliff for all founders (immediate restart)
Drag-Along: Investor-controlled drag-along at any valuation`,

      'safe': `Y Combinator Post-Money SAFE

Investor: Angel Syndicate
Company: Startup Inc.
Purchase Amount: $500,000
Valuation Cap: $8,000,000
Discount Rate: None
MFN: Yes
Pro-Rata Rights: Yes, for investments $250K and above
Conversion: Converts on equity financing of $1M or more`,

      'note': `Convertible Note Term Sheet

Principal: $750,000
Interest Rate: 8% per annum (simple)
Maturity: 24 months
Valuation Cap: $6,000,000
Discount Rate: 20%
Conversion Trigger: Qualified financing of $500K or more
Maturity Conversion: At cap if no qualified financing
Security: Unsecured
Most Favored Nation: Yes
Board: No board rights`
    };

    const TERM_LABELS = {
      instrument: 'Investment Instrument',
      valuation: 'Valuation / Cap',
      investment_amount: 'Investment Amount',
      liquidation_preference: 'Liquidation Preference',
      anti_dilution: 'Anti-Dilution',
      board_composition: 'Board Composition',
      pro_rata_rights: 'Pro-Rata Rights',
      vesting: 'Vesting Schedule',
    };

    const BREAKDOWN_LABELS = {
      founder_friendliness: 'Founder Friendliness',
      valuation_fairness: 'Valuation Fairness',
      control_terms: 'Control Terms',
      liquidity_terms: 'Liquidity Terms',
      standard_terms: 'Standard Terms',
    };

    function scoreColor(n) {
      if (n >= 70) return '#4ade80';
      if (n >= 45) return '#fbbf24';
      return '#f87171';
    }

    function setExample(key) {
      const ta = document.getElementById('ts-input');
      ta.value = EXAMPLES[key];
      updateCharCount();
    }

    function updateCharCount() {
      const len = document.getElementById('ts-input').value.length;
      const el = document.getElementById('char-count');
      el.textContent = `${len.toLocaleString()} / 20,000`;
      el.classList.toggle('warn', len > 18000);
    }

    function switchTab(name) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.getElementById('tab-' + name).classList.add('active');
      document.getElementById('panel-' + name).classList.add('active');
    }

    function showError(msg) {
      const el = document.getElementById('error-banner');
      el.textContent = msg;
      el.classList.add('visible');
    }

    function hideError() {
      document.getElementById('error-banner').classList.remove('visible');
    }

    function renderResults(data) {
      const score = data.score.overall;
      const color = scoreColor(score);
      const arc = document.getElementById('score-arc');
      arc.style.stroke = color;
      arc.style.strokeDashoffset = 232.5 - (score / 100) * 232.5;

      const numEl = document.getElementById('score-num');
      numEl.textContent = score;
      numEl.style.color = color;

      document.getElementById('score-verdict').textContent = data.score.verdict;

      document.getElementById('score-bars').innerHTML =
        Object.entries(data.score.breakdown).map(([key, val]) => `
          <div class="score-bar-row">
            <span class="score-bar-label">${BREAKDOWN_LABELS[key] || key}</span>
            <div class="score-bar-track">
              <div class="score-bar-fill" style="width:${val}%;background:${scoreColor(val)};"></div>
            </div>
            <span class="score-bar-val">${val}</span>
          </div>
        `).join('');

      document.getElementById('summary-text').innerHTML = data.summary
        .split('\n\n').filter(p => p.trim()).map(p => `<p>${p.trim()}</p>`).join('');

      document.getElementById('terms-grid').innerHTML =
        Object.entries(data.key_terms).map(([key, val]) => `
          <div class="term-card">
            <div class="term-label">${TERM_LABELS[key] || key}</div>
            <div class="term-value">${val}</div>
          </div>
        `).join('');

      document.getElementById('flag-list').innerHTML =
        data.red_flags.map(f => `
          <div class="flag-item flag-${f.severity}">
            <div class="flag-title">
              <span class="severity-badge severity-${f.severity}">${f.severity}</span>
              ${f.flag}
            </div>
            <div class="flag-detail">${f.detail}</div>
          </div>
        `).join('');

      document.getElementById('recs-list').innerHTML =
        data.recommendations.map((r, i) => `
          <div class="rec-item">
            <div class="rec-num">${i + 1}</div>
            <div class="rec-content">
              <div class="rec-title">${r.action}</div>
              <div class="rec-detail">${r.detail}</div>
            </div>
          </div>
        `).join('');
    }

    async function analyze() {
      const termsheet = document.getElementById('ts-input').value.trim();
      if (!termsheet) { showError('Please paste a term sheet first.'); return; }
      if (termsheet.length > 20000) { showError('Term sheet is too long (max 20,000 characters).'); return; }

      const btn = document.getElementById('analyze-btn');
      btn.disabled = true;
      hideError();
      document.getElementById('loading').classList.add('visible');
      document.getElementById('results').classList.remove('visible');

      try {
        const response = await fetch('/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ termsheet }),
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value);
          for (const line of chunk.split('\n').filter(l => l.startsWith('data: '))) {
            const payload = JSON.parse(line.slice(6));
            if (payload.status === 'done') {
              document.getElementById('loading').classList.remove('visible');
              renderResults(payload.result);
              document.getElementById('results').classList.add('visible');
              switchTab('summary');
            } else if (payload.status === 'error') {
              document.getElementById('loading').classList.remove('visible');
              showError(payload.message);
            }
          }
        }
      } catch (err) {
        document.getElementById('loading').classList.remove('visible');
        showError('Something went wrong. Please try again.');
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById('ts-input').addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') analyze();
    });
  </script>
</body>
</html>
